# Tomcat
server:
  port: 9211

# Spring
spring:
  application:
    # 应用名称
    name: teaching-system
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: 127.0.0.1:8848
        namespace: 4bc34c5b-b51f-4847-bf0b-a9f4e6486749
      config:
        # 配置中心地址
        server-addr: 127.0.0.1:8848
        namespace: 4bc34c5b-b51f-4847-bf0b-a9f4e6486749
        # 配置文件格式
        file-extension: yml
        # 共享配置
        shared-configs:
          - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
  mail:
    host: smtpdm.aliyun.com
    port: 465
    username: notice@ksup.cn
    password: ${V1_SMTP_PASSWORD:}
    from: 2217056@qq.com
    ssl:
      enable: true
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            socketFactory:
              class: javax.net.ssl.SSLSocketFactory
              fallback: false
              port: 465
          timeout: 5000
          connectiontimeout: 5000
          writetimeout: 5000
v2:
  payout-transition:
    # Keep the bridge disabled until a trusted HTTPS V2 endpoint, machine credential,
    # and approved payout campaign are explicitly supplied for this environment.
    enabled: ${V2_PAYOUT_TRANSITION_ENABLED:false}
    api-base-url: ${V2_PAYOUT_TRANSITION_API_BASE_URL:}
    web-base-url: ${V2_PAYOUT_TRANSITION_WEB_BASE_URL:}
    campaign-id: ${V2_PAYOUT_TRANSITION_CAMPAIGN_ID:0}
    # Development escape hatch: even when true, the client accepts HTTP only on loopback hosts.
    allow-insecure-http: ${V2_PAYOUT_TRANSITION_ALLOW_INSECURE_HTTP:false}
