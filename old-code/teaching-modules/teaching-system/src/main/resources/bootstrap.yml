# Spring
spring:
  profiles:
    # 环境配置
    active: dev
    # 测试
#    active: test
#   active: cluster

# 仅信任明确配置的反向代理。Docker 默认链路为 Nginx -> Gateway -> System；
# 其他环境通过 SECURITY_PC_LOGIN_TRUSTED_PROXIES 覆盖为实际代理主机/IP/网段。
security:
  pc-login:
    trusted-proxies: ${SECURITY_PC_LOGIN_TRUSTED_PROXIES:127.0.0.1;::1;teaching-gateway;teaching-nginx}

# 内嵌桥默认关闭；HMAC秘密只从V1_V2_INTERNAL_BRIDGE_HMAC_SECRET环境变量读取。
v2:
  internal-embedded:
    enabled: ${V2_INTERNAL_EMBEDDED_ENABLED:false}
    internal-base-url: ${V2_INTERNAL_BASE_URL:}
    same-origin-prefix: ${V2_EMBEDDED_PROXY_PREFIX:/v2-embedded}
    allow-private-http: ${V2_INTERNAL_ALLOW_PRIVATE_HTTP:false}
    connect-timeout: ${V2_INTERNAL_CONNECT_TIMEOUT:3s}
    read-timeout: ${V2_INTERNAL_READ_TIMEOUT:5s}

# 先执行V1名单建表、匹配审核与启用脚本，再显式开放。关闭时也不恢复无资格校验的旧入口。
v1:
  team-collection:
    enabled: ${V1_TEAM_COLLECTION_ENABLED:true}

    # 独立入口，复用名单和队伍办理状态；默认关闭。
    native-enabled: ${V1_TEAM_COLLECTION_NATIVE_ENABLED:true}
