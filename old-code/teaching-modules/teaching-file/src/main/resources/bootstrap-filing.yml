# Tomcat
server:
  port: 9320

# Spring
spring:
  application:
    # 应用名称
    name: teaching-file
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: 172.22.215.111:8848
        namespace: 10e03e86-54ad-4bfb-ac57-5a05d437e2e6
      config:
        # 配置中心地址
        server-addr: 172.22.215.111:8848
        namespace: 10e03e86-54ad-4bfb-ac57-5a05d437e2e6
        # 配置文件格式
        file-extension: yml
        # 共享配置
        shared-configs:
          - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
  servlet:
    multipart:
      location: ${java.io.tmpdir}
      file-size-threshold: 2KB
      max-file-size: 500MB
      max-request-size: 500MB

ffmpeg:
  ffmpeg-path: ffmpeg
  font-path: C:/Windows/Fonts/simsun.ttc


