# Tomcat
server:
  port: 9998

# Spring
spring:
  application:
    # 应用名称
    name: teaching-gateway
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: 172.22.215.111:8848
        namespace: d55d997c-cb7f-4468-8f6c-18d5456cb84e
      config:
        # 配置中心地址
        server-addr: 172.22.215.111:8848
        namespace: d55d997c-cb7f-4468-8f6c-18d5456cb84e
        # 配置文件格式
        file-extension: yml
        # 共享配置
        shared-configs:
          - application-dev.${spring.cloud.nacos.config.file-extension}
    sentinel:
      # 取消控制台懒加载
      eager: true
      transport:
        # 控制台地址
        dashboard: 172.22.215.111:8718
      # nacos配置持久化
      datasource:
        ds1:
          nacos:
            server-addr: 172.22.215.111:8848
            dataId: sentinel-teaching-gateway
            groupId: DEFAULT_GROUP
            data-type: json
            rule-type: gw-flow
