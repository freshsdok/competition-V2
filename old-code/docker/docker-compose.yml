version : '3.8'
services:
  teaching-nacos:
    container_name: teaching-nacos
    image: nacos/nacos-server
    build:
      context: ./nacos
    environment:
      - MODE=standalone
    volumes:
      - ./nacos/logs/:/home/nacos/logs
      - ./nacos/conf/application.properties:/home/nacos/conf/application.properties
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    depends_on:
      - teaching-mysql
  teaching-mysql:
    container_name: teaching-mysql
    image: mysql:5.7
    build:
      context: ./mysql
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/conf:/etc/mysql/conf.d
      - ./mysql/logs:/logs
      - ./mysql/data:/var/lib/mysql
    command: [
          'mysqld',
          '--innodb-buffer-pool-size=80M',
          '--character-set-server=utf8mb4',
          '--collation-server=utf8mb4_unicode_ci',
          '--default-time-zone=+8:00',
          '--lower-case-table-names=1'
        ]
    environment:
      MYSQL_DATABASE: 'ce-cloud'
      MYSQL_ROOT_PASSWORD: cesoft@2023
  teaching-redis:
    container_name: teaching-redis
    image: redis
    build:
      context: ./redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis/conf/redis.conf:/home/teaching/redis/redis.conf
      - ./redis/data:/data
    command: redis-server /home/teaching/redis/redis.conf
  teaching-nginx:
    container_name: teaching-nginx
    image: nginx
    build:
      context: ./nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/html/dist:/home/teaching/projects/teaching-ui
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/logs:/var/log/nginx
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - teaching-gateway
    links:
      - teaching-gateway
  teaching-gateway:
    container_name: teaching-gateway
    build:
      context: ./teaching/gateway
      dockerfile: dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - teaching-redis
    links:
      - teaching-redis
  teaching-auth:
    container_name: teaching-auth
    build:
      context: ./teaching/auth
      dockerfile: dockerfile
    ports:
      - "9200:9200"
    depends_on:
      - teaching-redis
    links:
      - teaching-redis
  teaching-modules-system:
    container_name: teaching-modules-system
    build:
      context: ./teaching/modules/system
      dockerfile: dockerfile
    ports:
      - "9201:9201"
    depends_on:
      - teaching-redis
      - teaching-mysql
    links:
      - teaching-redis
      - teaching-mysql
  teaching-modules-gen:
    container_name: teaching-modules-gen
    build:
      context: ./teaching/modules/gen
      dockerfile: dockerfile
    ports:
      - "9202:9202"
    depends_on:
      - teaching-mysql
    links:
      - teaching-mysql
  teaching-modules-job:
    container_name: teaching-modules-job
    build:
      context: ./teaching/modules/job
      dockerfile: dockerfile
    ports:
      - "9203:9203"
    depends_on:
      - teaching-mysql
    links:
      - teaching-mysql
  teaching-modules-file:
    container_name: teaching-modules-file
    build:
      context: ./teaching/modules/file
      dockerfile: dockerfile
    ports:
      - "9300:9300"
    volumes:
    - ./teaching/uploadPath:/home/teaching/uploadPath
  teaching-visual-monitor:
    container_name: teaching-visual-monitor
    build:
      context: ./teaching/visual/monitor
      dockerfile: dockerfile
    ports:
      - "9100:9100"
